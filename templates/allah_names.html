      color: #1e293b;
      overflow-x: hidden;
    }

    /* Fixed Green Sticky Header */
    .top-header {
      background: linear-gradient(135deg, #064e3b 0%, #047857 100%) !important;
      color: #ffffff !important;
      padding: 14px 16px;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 4px 14px rgba(6, 78, 59, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .back-btn {
      text-decoration: none;
      color: #d1fae5;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .page-title {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      flex-grow: 1;
    }

    .container {
      width: 100%;
      max-width: 550px;
      margin: 16px auto 0 auto;
      padding: 0 14px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #d1fae5;
      border-radius: 14px;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(6, 78, 59, 0.04);
    }
    .search-input:focus {
      border-color: #047857;
    }

    .names-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
    }
    .name-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px 12px 14px 12px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.03);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .name-card:hover {
      border-color: #a7f3d0;
    }
    .name-card:active {
      transform: scale(0.97);
    }

    .name-number {
      position: absolute;
      top: 8px;
      left: 10px;
      font-size: 11px;
      font-weight: 800;
      color: #047857;
      background: #ecfdf5;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid #a7f3d0;
    }
    .name-arabic {
      font-size: 26px;
      font-weight: bold;
      color: #064e3b;
      font-family: 'Amiri Quran', serif;
      margin-top: 10px;
      margin-bottom: 4px;
      direction: rtl;
      line-height: 1.5;
    }
    .name-trans {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .name-urdu {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
      direction: rtl;
      font-family: 'Noto Nastaliq Urdu', serif;
    }
    .name-meaning-en {
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
      font-weight: 500;
      margin-top: 2px;
    }

    /* Standardized Bottom Navigation */
    .bottom-nav {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      height: 64px !important;
      background: #ffffff !important;
      display: flex !important;
      flex-direction: row !important;
      justify-content: space-around !important;
      align-items: center !important;
      border-top: 1.5px solid #e2e8f0 !important;
      box-shadow: 0 -4px 14px rgba(0,0,0,0.06) !important;
      z-index: 999999 !important;
      direction: ltr !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    .nav-item {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      text-decoration: none !important;
      color: #64748b !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      flex: 1 !important;
      cursor: pointer !important;
      gap: 3px !important;
      background: transparent !important;
      border: none !important;
    }
    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.2;
      stroke: #64748b;
      fill: none;
      transition: all 0.2s ease;
    }
    .nav-item.active {
      color: #047857 !important;
      font-weight: 800 !important;
    }
    .nav-item.active svg {
      stroke: #047857 !important;
      transform: scale(1.1);
    }
  </style>

    function applyPageLanguage() {
      const currentLang = localStorage.getItem('more_page_lang') || 'ur';
      const isUrdu = (currentLang === 'ur');

      const headerTitle = document.getElementById('pageHeaderTitle');
      if (headerTitle) {
        headerTitle.innerText = isUrdu ? "اسماء الحسنىٰ (99 Names)" : "99 Beautiful Names of Allah";
      }

      const searchInput = document.getElementById('nameSearch');
      if (searchInput) {
        searchInput.placeholder = isUrdu ? "نام یا ترجمہ تلاش کریں / Search name..." : "Search by name or meaning...";
      }

      renderCards(allahNames);
    }

    function renderCards(list) {
      const currentLang = localStorage.getItem('more_page_lang') || 'ur';
      const isUrdu = (currentLang === 'ur');

      const container = document.getElementById('namesContainer');
      container.innerHTML = '';

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'name-card';
        card.innerHTML = `
          <span class="name-number">#${item.id}</span>
          <div class="name-arabic">${item.ar}</div>
          <div class="name-trans">${item.en}</div>
          <div class="name-urdu">${item.ur}</div>
          ${!isUrdu && item.enMeaning ? `<div class="name-meaning-en">${item.enMeaning}</div>` : ''}
        `;
        container.appendChild(card);
      });
    }

    function filterNames() {
      const q = document.getElementById('nameSearch').value.toLowerCase();
      const filtered = allahNames.filter(n => 
        n.en.toLowerCase().includes(q) || 
        n.ur.includes(q) || 
        n.ar.includes(q) ||
        (n.enMeaning && n.enMeaning.toLowerCase().includes(q))
      );
      renderCards(filtered);
    }

    document.addEventListener("DOMContentLoaded", () => {
      applyPageLanguage();
    });

    function openQuranModal() {
      var modal = document.getElementById('quranModal');
      if (modal) { modal.style.display = 'flex'; }
    }
    function closeQuranModal() {
      var modal = document.getElementById('quranModal');
      if (modal) { modal.style.display = 'none'; }
    }

    (function() {
      if (localStorage.getItem('app_reading_mode') === 'eyecare') {
        document.body.classList.add('eyecare-mode');
      }
    })();
  </script>
