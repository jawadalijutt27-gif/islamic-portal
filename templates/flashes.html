<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>اسلامی چمکتے موتی - Flashes</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f8fafc;
      padding-bottom: 95px;
      color: #1e293b;
      overflow-x: hidden;
    }

    /* Fixed Green Sticky Header */
    .top-header {
      background: linear-gradient(135deg, #064e3b 0%, #047857 100%) !important;
      color: #ffffff !important;
      padding: 14px 16px;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 4px 14px rgba(6, 78, 59, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .back-btn {
      text-decoration: none;
      color: #d1fae5;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .page-title {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      flex-grow: 1;
    }

    .container {
      width: 100%;
      max-width: 550px;
      margin: 16px auto 0 auto;
      padding: 0 14px;
    }

    .update-banner {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(6, 78, 59, 0.04);
    }
    .update-banner.rtl {
      direction: rtl;
    }
    .update-banner.ltr {
      direction: ltr;
    }
    .update-text {
      font-size: 13px;
      color: #064e3b;
      font-weight: 600;
    }
    .btn-refresh {
      background: #047857;
      color: #ffffff;
      border: none;
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn-refresh:active {
      transform: scale(0.96);
    }

    .flash-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.03);
      position: relative;
      animation: fadeIn 0.3s ease;
    }
    .flash-card.rtl {
      direction: rtl;
      text-align: right;
    }
    .flash-card.ltr {
      direction: ltr;
      text-align: left;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .flash-category {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cat-quran { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .cat-hadith { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .cat-wisdom { background: #e0e7ff; color: #4338ca; border: 1px solid #c7d2fe; }

    .flash-arabic {
      font-size: 21px;
      line-height: 2;
      text-align: right;
      direction: rtl;
      font-family: 'Amiri Quran', serif;
      color: #0f172a;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .flash-trans {
      font-size: 14px;
      line-height: 1.8;
      color: #475569;
      margin-bottom: 14px;
      border-top: 1px dashed #e2e8f0;
      padding-top: 10px;
    }
    .flash-trans.rtl {
      font-family: 'Noto Nastaliq Urdu', serif;
      line-height: 1.9;
      direction: rtl;
      text-align: right;
    }
    .flash-trans.ltr {
      font-family: 'Plus Jakarta Sans', sans-serif;
      direction: ltr;
      text-align: left;
    }

    .flash-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #f1f5f9;
      padding-top: 10px;
    }
    .flash-ref {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }
    .btn-action {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #475569;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.15s ease;
    }
    .btn-action:hover {
      background: #ecfdf5;
      color: #047857;
      border-color: #a7f3d0;
    }

    /* Standardized Bottom Navigation */
    .bottom-nav {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      height: 64px !important;
      background: #ffffff !important;
      display: flex !important;
      flex-direction: row !important;
      justify-content: space-around !important;
      align-items: center !important;
      border-top: 1.5px solid #e2e8f0 !important;
      box-shadow: 0 -4px 14px rgba(0,0,0,0.06) !important;
      z-index: 999999 !important;
      direction: ltr !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    .nav-item {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      text-decoration: none !important;
      color: #64748b !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      flex: 1 !important;
      cursor: pointer !important;
      gap: 3px !important;
      background: transparent !important;
      border: none !important;
    }
    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.2;
      stroke: #64748b;
      fill: none;
      transition: all 0.2s ease;
    }
    .nav-item.active {
      color: #047857 !important;
      font-weight: 800 !important;
    }
    .nav-item.active svg {
      stroke: #047857 !important;
      transform: scale(1.1);
    }
  </style>

  <!-- Global Eye Care Mode CSS -->
  <style id="eyecare-style">
    body.eyecare-mode {
      background-color: #f6eedb !important;
      color: #2d241e !important;
    }
    body.eyecare-mode .flash-card,
    body.eyecare-mode .update-banner,
    body.eyecare-mode .bottom-nav {
      background-color: #ede2c8 !important;
      border-color: #d8c8a7 !important;
    }
    body.eyecare-mode .top-header {
      background: linear-gradient(135deg, #1e3a2b, #134e35) !important;
    }
  </style>
</head>
<body>

  <!-- Top Sticky Header -->
  <header class="top-header">
    <a href="/more" class="back-btn">← Back</a>
    <div class="page-title" id="pageHeaderTitle">چمکتے موتی (Flashes)</div>

  </header>

  <main class="container">
    <!-- 24-Hours Auto Update Banner -->
    <div class="update-banner rtl" id="updateBanner">
      <div class="update-text" id="updateIndicator">🔄 روزانہ 24 گھنٹے بعد خودکار تبدیل</div>
      <button class="btn-refresh" id="refreshBtn" onclick="shuffleFlashes()">نئی نصیحتیں ⟳</button>
    </div>

    <!-- Container for dynamically injected flashes -->
    <div id="flashesContainer"></div>
  </main>

  <!-- Standardized Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="javascript:void(0)" onclick="openQuranModal()" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>

  <!-- Quran Selection Popup Modal -->
  <div id="quranModal" style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999999; align-items: center; justify-content: center;">
    <div style="background: #ffffff; width: 88%; max-width: 360px; border-radius: 20px; padding: 22px 18px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.25);">
      <h3 style="margin: 0 0 6px 0; color: #064e3b; font-size: 19px; font-weight: 700;">Select Quran Option</h3>
      <p style="color: #4b5563; font-size: 13px; margin: 0 0 18px 0;">Aap kya parhna ya sunna chahte hain?</p>
      
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <a href="/surah/1" style="text-decoration: none; display: flex; align-items: center; gap: 14px; padding: 14px; background: #f9fafb; border: 1.5px solid #e5e7eb; border-radius: 16px;">
          <span style="font-size: 24px; background: #ecfdf5; padding: 8px 12px; border-radius: 12px; color: #047857;">📖</span>
          <div style="text-align: left;">
            <div style="font-size: 15px; font-weight: 700; color: #064e3b;">Quran (Translation)</div>
            <div style="font-size: 12px; color: #6b7280; font-weight: 500; margin-top: 2px;">Parhein ba-tarjuma</div>
          </div>
        </a>

        <a href="/tilawat" style="text-decoration: none; display: flex; align-items: center; gap: 14px; padding: 14px; background: #f9fafb; border: 1.5px solid #e5e7eb; border-radius: 16px;">
          <span style="font-size: 24px; background: #ecfdf5; padding: 8px 12px; border-radius: 12px; color: #047857;">🎧</span>
          <div style="text-align: left;">
            <div style="font-size: 15px; font-weight: 700; color: #064e3b;">Tilawat Quran (Audio)</div>
            <div style="font-size: 12px; color: #6b7280; font-weight: 500; margin-top: 2px;">Suniein khubsurat aawaz mein</div>

      <button type="button" onclick="closeQuranModal()" style="margin-top: 18px; width: 100%; padding: 10px; background: #f3f4f6; border: none; border-radius: 12px; font-weight: 600; color: #4b5563; cursor: pointer;">
        Close

  <script>
    const flashesDatabase = [
      {
        cat: "cat-quran",
        catNameUr: "قرآنی پیغام",
        catNameEn: "Quranic Verse",
        arabic: "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ، إِنَّ مَعَ الْعُسْرِ يُسْرًا",
        transUr: "پس یقیناً تنگی کے ساتھ آسانی ہے، بے شک تنگی کے ساتھ ہی آسانی ہے۔",
        transEn: "For indeed, with hardship [will be] ease. Indeed, with hardship [will be] ease.",
        refUr: "سورۃ الشرح: 5-6",
        refEn: "Surah Ash-Sharh: 5-6"
      },
      {
        cat: "cat-hadith",
        catNameUr: "فرمانِ مصطفیٰ ﷺ",
        catNameEn: "Prophetic Hadith",
        arabic: "مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ",
        transUr: "جو شخص اللہ اور یومِ آخرت پر ایمان رکھتا ہے اسے چاہیے کہ اچھی بات کہے یا خاموش رہے۔",
        transEn: "Whoever believes in Allah and the Last Day should speak what is good or remain silent.",
        refUr: "صحیح بخاری: 6018",
        refEn: "Sahih Bukhari: 6018"
      },
      {
        cat: "cat-quran",
        catNameUr: "قرآنی پیغام",
        catNameEn: "Quranic Verse",
        arabic: "أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",
        transUr: "یاد رکھو! اللہ کے ذکر ہی سے دلوں کو اطمینان حاصل ہوتا ہے۔",
        transEn: "Unquestionably, by the remembrance of Allah hearts are assured.",
        refUr: "سورۃ الرعد: 28",
        refEn: "Surah Ar-Ra'd: 28"
      },
      {
        cat: "cat-hadith",
        catNameUr: "فرمانِ مصطفیٰ ﷺ",
        catNameEn: "Prophetic Hadith",
        arabic: "تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ",
        transUr: "اپنے بھائی کے سامنے تمہارا مسکرا دینا بھی تمہارے لیے صدقہ ہے۔",
        transEn: "Smiling in the face of your brother is an act of charity for you.",
        refUr: "جامع ترمذی: 1956",
        refEn: "Jami At-Tirmidhi: 1956"
      },
      {
        cat: "cat-wisdom",
        catNameUr: "حکمت کی بات",
        catNameEn: "Islamic Wisdom",
        arabic: "إِنَّ اللَّهَ يُحِبُّ إِذَا عَمِلَ أَحَدُكُمْ عَمَلًا أَنْ يُتْقِنَهُ",
        transUr: "بے شک اللہ تعالیٰ پسند فرماتا ہے کہ جب تم میں سے کوئی شخص کوئی کام کرے تو اسے مہارت اور مضبوطی سے کرے۔",
        transEn: "Verily, Allah loves that whenever any of you does something, they do it with excellence.",
        refUr: "شعب الایمان: 4930",
        refEn: "Shu'ab al-Iman: 4930"
      },
      {
        cat: "cat-quran",
        catNameUr: "قرآنی پیغام",
        catNameEn: "Quranic Verse",
        arabic: "وَقُولُوا لِلنَّاسِ حُسْنًا",
        transUr: "اور لوگوں سے اچھی اور میٹھی بات کہا کرو۔",
        transEn: "And speak to people good words.",
        refUr: "سورۃ البقرۃ: 83",
        refEn: "Surah Al-Baqarah: 83"
      },
      {
        cat: "cat-hadith",
        catNameUr: "فرمانِ مصطفیٰ ﷺ",
        catNameEn: "Prophetic Hadith",
        arabic: "خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ",
        transUr: "تم میں سے سب سے بہتر وہ شخص ہے جس نے قرآن سیکھا اور اسے دوسروں کو سکھایا۔",
        transEn: "The best among you are those who learn the Quran and teach it to others.",
        refUr: "صحیح بخاری: 5027",
        refEn: "Sahih Bukhari: 5027"
      },
      {
        cat: "cat-quran",
        catNameUr: "قرآنی پیغام",
        catNameEn: "Quranic Verse",
        arabic: "إِنَّ رَحْمَتَ اللَّهِ قَرِيبٌ مِّنَ الْمُحْسِنِينَ",
        transUr: "بے شک اللہ کی رحمت احسان کرنے والے نیکوکاروں کے بالکل قریب ہے۔",
        transEn: "Indeed, the mercy of Allah is near to the doers of good.",
        refUr: "سورۃ الاعراف: 56",
        refEn: "Surah Al-A'raf: 56"
      },
      {
        cat: "cat-hadith",
        catNameUr: "فرمانِ مصطفیٰ ﷺ",
        catNameEn: "Prophetic Hadith",
        arabic: "الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ",
        transUr: "حقیقی مسلمان وہ ہے جس کی زبان اور ہاتھ کے شر سے دوسرے مسلمان محفوظ رہیں۔",
        transEn: "A true Muslim is the one from whose tongue and hand the Muslims are safe.",
        refUr: "صحیح بخاری: 10",
        refEn: "Sahih Bukhari: 10"
      },
      {
        cat: "cat-wisdom",
        catNameUr: "حکمت کی بات",
        catNameEn: "Islamic Wisdom",
        arabic: "الدُّنْيَا سَاعَةٌ فَاجْعَلْهَا طَاعَةً",
        transUr: "دنیا کی زندگی چند لمحوں کی ہے، پس اسے اللہ کی اطاعت میں گزار دو۔",
        transEn: "The life of this world is but an hour, so spend it in obedience to Allah.",
        refUr: "اقوالِ سلف",
        refEn: "Sayings of the Salaf"
      }
    ];

    let currentList = [];

    function getDailyFlashes() {
      const today = new Date();
      const dateSeed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
      
      let cloned = [...flashesDatabase];
      for (let i = cloned.length - 1; i > 0; i--) {
        const j = (dateSeed + i * 7) % (i + 1);
        [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
      }
      return cloned.slice(0, 4);
    }

    function renderFlashes(list) {
      currentList = list;
      const currentLang = localStorage.getItem('more_page_lang') || 'ur';
      const isUrdu = (currentLang === 'ur');

      const container = document.getElementById('flashesContainer');
      container.innerHTML = '';

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = `flash-card ${isUrdu ? 'rtl' : 'ltr'}`;

        const catName = isUrdu ? item.catNameUr : item.catNameEn;
        const transText = isUrdu ? item.transUr : item.transEn;
        const refText = isUrdu ? item.refUr : item.refEn;
        const copyBtnText = isUrdu ? "کاپی کریں 📋" : "Copy 📋";

        card.innerHTML = `
          <span class="flash-category ${item.cat}">${catName}</span>
          <div class="flash-arabic">${item.arabic}</div>
          <div class="flash-trans ${isUrdu ? 'rtl' : 'ltr'}">${transText}</div>
          <div class="flash-footer">
            <span class="flash-ref">${refText}</span>
            <button class="btn-action" onclick="copyFlash(this)">${copyBtnText}</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function applyPageLanguage() {
      const currentLang = localStorage.getItem('more_page_lang') || 'ur';
      const isUrdu = (currentLang === 'ur');

      const headerTitle = document.getElementById('pageHeaderTitle');
      if (headerTitle) {
        headerTitle.innerText = isUrdu ? "چمکتے موتی (Flashes)" : "Islamic Wisdom Flashes";
      }

      const updateBanner = document.getElementById('updateBanner');
      const updateIndicator = document.getElementById('updateIndicator');
      const refreshBtn = document.getElementById('refreshBtn');

      if (updateBanner) {
        updateBanner.className = `update-banner ${isUrdu ? 'rtl' : 'ltr'}`;
      }
      if (updateIndicator) {
        updateIndicator.innerText = isUrdu 
          ? "🔄 روزانہ 24 گھنٹے بعد خودکار تبدیل" 
          : "🔄 Auto-updates every 24 hours";
      }
      if (refreshBtn) {
        refreshBtn.innerText = isUrdu ? "نئی نصیحتیں ⟳" : "New Flashes ⟳";
      }

      renderFlashes(currentList.length ? currentList : getDailyFlashes());
    }

    function shuffleFlashes() {
      const currentLang = localStorage.getItem('more_page_lang') || 'ur';
      const isUrdu = (currentLang === 'ur');

      const shuffled = [...flashesDatabase].sort(() => 0.5 - Math.random()).slice(0, 4);
      renderFlashes(shuffled);
      
      document.getElementById('updateIndicator').innerText = isUrdu 
        ? "✓ نئی نصیحتیں لوڈ ہو گئیں" 
        : "✓ Fresh insights loaded!";
    }

    function copyFlash(button) {
      const currentLang = localStorage.getItem('more_page_lang') || 'ur';
      const isUrdu = (currentLang === 'ur');

      const card = button.closest('.flash-card');
      const arabic = card.querySelector('.flash-arabic').innerText;
      const trans = card.querySelector('.flash-trans').innerText;
      const ref = card.querySelector('.flash-ref').innerText;

      const fullText = `${arabic}\n\n${trans}\n\n(${ref})`;

      navigator.clipboard.writeText(fullText).then(() => {
        const originalText = button.innerText;
        button.innerText = isUrdu ? "کاپی ہو گیا! ✓" : "Copied! ✓";
        setTimeout(() => {
          button.innerText = originalText;
        }, 1800);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      applyPageLanguage();
    });

    function openQuranModal() {
      var modal = document.getElementById('quranModal');
      if (modal) { modal.style.display = 'flex'; }
    }
    function closeQuranModal() {
      var modal = document.getElementById('quranModal');
      if (modal) { modal.style.display = 'none'; }
    }

    (function() {
      if (localStorage.getItem('app_reading_mode') === 'eyecare') {
        document.body.classList.add('eyecare-mode');
      }
    })();
  </script>
</body>
</html>
