<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Tasbeeh</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f7fafc; padding: 20px 16px 85px; text-align: center; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
    .back-btn { text-decoration: none; color: #1a4fba; font-weight: bold; font-size: 15px; }
    .zikr-select {
      width: 100%; max-width: 320px; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e0;
      font-size: 16px; margin-bottom: 30px; background: white; outline: none; font-weight: 600;
    }
    .counter-display {
      width: 220px; height: 220px; background: #1a4fba; color: white; border-radius: 50%;
      margin: 0 auto 30px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; box-shadow: 0 10px 25px rgba(26, 79, 186, 0.35);
      user-select: none; cursor: pointer; transition: transform 0.1s;
    }
    .counter-display:active { transform: scale(0.95); }
    .count-num { font-size: 64px; font-weight: bold; }
    .tap-text { font-size: 13px; opacity: 0.8; margin-top: 4px; }
    .btn-reset {
      background: #e53e3e; color: white; border: none; padding: 10px 24px;
      font-size: 14px; border-radius: 20px; cursor: pointer; font-weight: 600;
    }
  </style>

    <!-- Global Eye Care Mode CSS (Safe Layout) -->
    <style id="eyecare-style">
        body.eyecare-mode {
            background-color: #f6eedb !important;
            color: #2d241e !important;
        }
        body.eyecare-mode .card,
        body.eyecare-mode .ayat-card,
        body.eyecare-mode .hadith-card,
        body.eyecare-mode .ibadaat-card,
        body.eyecare-mode .prayer-capsule,
        body.eyecare-mode .nav-bar,
        body.eyecare-mode .bottom-nav {
            background-color: #ede2c8 !important;
            border-color: #d8c8a7 !important;
        }
        body.eyecare-mode .top-header {
            background: linear-gradient(135deg, #1e3a2b, #134e35) !important;
        }
    </style>

</head>
<body>

  <div class="top-bar">
    <a href="/more" class="back-btn">← Back to Menu</a>
    <h3 style="font-size: 17px; color: #2d3748;">Digital Tasbeeh</h3>
    <div style="width: 50px;"></div>
  </div>

  <select class="zikr-select" id="zikrText">
    <option>سُبْحَانَ اللَّهِ (SubhanAllah)</option>
    <option>الْحَمْدُ لِلَّهِ (Alhamdulillah)</option>
    <option>اللَّهُ أَكْبَرُ (Allahu Akbar)</option>
    <option>لَا إِلٰهَ إِلَّا اللَّهُ (La ilaha illallah)</option>
    <option>أَسْتَغْفِرُ اللَّهَ (Astaghfirullah)</option>
  </select>

  <div class="counter-display" onclick="incrementCounter()">
    <div class="count-num" id="counter">0</div>
    <div class="tap-text">TAP TO COUNT</div>
  </div>

  <button class="btn-reset" onclick="resetCounter()">Reset Count</button>

  <script>
    let count = 0;
    function incrementCounter() {
      count++;
      document.getElementById('counter').innerText = count;
      if (navigator.vibrate) navigator.vibrate(40);
    }
    function resetCounter() {
      if(confirm('Are you sure you want to reset?')) {
        count = 0;
        document.getElementById('counter').innerText = 0;
      }
    }
  </script>

    <!-- Global Eye Care Preference Loader -->
    <script>
        (function() {
            if (localStorage.getItem('app_reading_mode') === 'eyecare') {
                document.body.classList.add('eyecare-mode');
            }
        })();
    </script>

</body>
</html>
