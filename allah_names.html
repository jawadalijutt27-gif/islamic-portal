  <title>اسماء الحسنىٰ - 99 Names of Allah</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f7fafc;
      padding: 16px 16px 85px 16px;
      color: #2d3748;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .back-btn {
      text-decoration: none;
      color: #1a4fba;
      font-weight: 700;
      font-size: 15px;
    }
    .page-title {
      font-size: 18px;
      color: #1a202c;
      font-weight: bold;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e0;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 18px;
      outline: none;
      background: #ffffff;
    }
    .search-input:focus {
      border-color: #1a4fba;
    }
    .names-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 500px;
      margin: 0 auto;
    }
    .name-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      position: relative;
    }
    .name-number {
      position: absolute;
      top: 8px;
      left: 10px;
      font-size: 11px;
      font-weight: bold;
      color: #a0aec0;
      background: #edf2f7;
      padding: 2px 6px;
      border-radius: 10px;
    }
    .name-arabic {
      font-size: 26px;
      font-weight: bold;
      color: #1a4fba;
      font-family: 'Amiri', 'Traditional Arabic', serif;
      margin-top: 8px;
      margin-bottom: 4px;
      direction: rtl;
    }
    .name-trans {
      font-size: 12px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 4px;
    }
    .name-urdu {
      font-size: 12px;
      color: #718096;
      line-height: 1.4;
      direction: rtl;
    }
  </style>

    function renderCards(list) {
      const container = document.getElementById('namesContainer');
      container.innerHTML = '';
      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'name-card';
        card.innerHTML = `
          <span class="name-number">#${item.id}</span>
          <div class="name-arabic">${item.ar}</div>
          <div class="name-trans">${item.en}</div>
          <div class="name-urdu">${item.ur}</div>
        `;
        container.appendChild(card);
      });
    }

    function filterNames() {
      const q = document.getElementById('nameSearch').value.toLowerCase();
      const filtered = allahNames.filter(n => 
        n.en.toLowerCase().includes(q) || 
        n.ur.includes(q) || 
        n.ar.includes(q)
      );
      renderCards(filtered);
    }

    renderCards(allahNames);
